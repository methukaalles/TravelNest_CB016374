<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelNest | Trip Generator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/recommender.css">
    <script src="javascript/generator.js" defer></script>
    <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>
   
    <header id="main-header">
        <nav class="navbar">
            <div class="logo">
                <a href = "index.html">
                    <img src="images/TravelNest.png" alt="TravelNest Logo" width="156" height="100">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="explorer.html">Destination Explorer</a></li>
                <li><a href="planner.html">Budget Planner</a></li>
                <li><a href="generator.html" class="active">Trip Generator</a></li>
                <li><a href="mood.html">Travel Mood</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
            <div class="hamburger">☰</div>
        </nav>
    </header>

    <main class="page-content">
        <h1>Random Trip Generator</h1>
        <p class="lead">Not sure where to go? Let us surprise you!</p>

        <div class="recommender-controls">
            <select id="type-select">
                <option value="">Any Travel Type</option>
                <option value="adventure">Adventure</option>
                <option value="relaxation">Relaxation</option>
                <option value="cultural">Cultural</option>
                <option value="nature">Nature</option>
            </select>
            <select id="budget-select">
                <option value="">Any Budget</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button id="pick-btn">Surprise Me!</button>
        </div>

        <div id="recommendation-area" class="recommendation-area"></div>

        <div style="display:flex;gap:1rem;flex-wrap:wrap;">
            <button id="pick-again-btn" style="display:none;">Surprise Me Again</button>
            <button id="save-btn" style="display:none;">Save to Wishlist</button>
        </div>

        <div class="saved-list">
            <h2>My Wishlist</h2>
            <ul id="wishlist-list"></ul>
        </div>
    </main>

    <footer><div class="footer-content">
            <form id="newsletter-form" style="margin-bottom:1.5rem;">
                <div style="display:flex;justify-content:center;gap:0.5rem;flex-wrap:wrap;">
                    <input type="email" id="newsletter-email" placeholder="Get travel tips in your inbox" required style="padding:0.7rem 1rem;width:280px;border:none;border-radius:4px;">
                    <button type="submit" id="subscribe-button" style="padding:0 1.5rem;background:#0284c8;color:#fff;border:none;border-radius:4px;cursor:pointer;">Subscribe</button>
                </div>
            </form>
            <nav class="footer-nav">
                <a href="index.html">Home</a>
                <a href="explorer.html">Explorer</a>
                <a href="planner.html">Budget Planner</a>
                <a href="generator.html">Trip Generator</a>
                <a href="mood.html">Travel Mood</a>
                <a href="feedback.html">Feedback</a>
            </nav>
            <p class="footer-text">© 2026 TravelNest. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
